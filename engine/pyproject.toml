[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiyi-engine"
version = "2.0.0"
description = "知译 PDF 2：自研的论文 PDF 翻译与排版引擎"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "pymupdf>=1.25.2,<2",
    "onnxruntime>=1.17",
    "numpy>=1.24",
    "httpx>=0.27",
    "fonttools>=4.50",
]

[project.optional-dependencies]
free = ["pdf2zh-next>=2.9"]
dev = ["pytest>=8"]

[project.scripts]
zhiyi = "zhiyi.cli:main"

[tool.setuptools.packages.find]
include = ["zhiyi*"]

[tool.setuptools.package-data]
zhiyi = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
